name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security problems must not be reported here.** Use Security → Report a vulnerability instead (see SECURITY.md).
        Do not paste tokens, secrets, real hostnames or customer data.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the engine with ...
        2. Create a source of kind ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Engine, Connector, SQL endpoint, Desktop app, Docs, Other]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04, Windows 11, macOS 15
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant engine log lines with secrets removed.
      render: text
