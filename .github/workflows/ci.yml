name: CI
on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
permissions:
  contents: read

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-deny --locked
      - run: cargo deny --locked check advisories licenses bans sources

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx prettier --check "src/**/*.{ts,tsx,css}"
      - run: npm run build
      - run: npm test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, cargo-deny, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: sigstore/cosign-installer@v3
      - run: cargo install cargo-auditable cargo-cyclonedx --locked
      - run: cargo auditable build --locked --release --bin straton-engine
      - run: cargo cyclonedx --all --format json
      - name: Stage binary and per-crate SBOMs
        shell: bash
        run: |
          mkdir -p release
          cp target/release/straton-engine release/straton-engine-linux-x86_64
          python3 - <<'PY'
          import json
          import pathlib
          import shutil
          for name in ('straton-core', 'straton-connectors', 'straton-engine'):
              candidates = []
              for path in pathlib.Path('crates', name).glob('*.json'):
                  if json.loads(path.read_text()).get('bomFormat') == 'CycloneDX':
                      candidates.append(path)
              if len(candidates) != 1:
                  raise SystemExit(f'Expected one CycloneDX SBOM for {name}: {candidates}')
              shutil.copyfile(candidates[0], pathlib.Path('release', name + '.cdx.json'))
          PY
      - name: Checksum and keyless-sign every artifact
        working-directory: release
        shell: bash
        run: |
          sha256sum straton-engine-linux-x86_64 *.cdx.json > SHA256SUMS
          for artifact in straton-engine-linux-x86_64 *.cdx.json SHA256SUMS; do
            cosign sign-blob --yes --bundle "$artifact.sigstore.json" "$artifact"
          done
      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes
