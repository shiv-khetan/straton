name: CI
on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # Tool versions are pinned (Dependabot does not track cargo install); bump them deliberately.
      - run: cargo install cargo-deny@0.20.2 --locked
      - run: cargo deny --locked check advisories licenses bans sources
      # The desktop shell has its own lockfile and policy (apps/desktop/src-tauri/deny.toml).
      - run: cargo deny --locked --manifest-path apps/desktop/src-tauri/Cargo.toml check advisories sources

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx prettier --check "src/**/*.{ts,tsx,css}"
      - run: npm run build
      - run: npm test

  desktop-bundle:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, cargo-deny, desktop]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: macos-latest
            bundles: dmg
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - run: npm ci
      # Unsigned bundles: add platform signing secrets here when available.
      - run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bundles"
          find src-tauri/target/release/bundle -maxdepth 2 -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*-setup.exe' \) \
            -exec cp {} "$GITHUB_WORKSPACE/bundles/" \;
          ls -la "$GITHUB_WORKSPACE/bundles"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.os }}
          path: bundles/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, cargo-deny, desktop, desktop-bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      # Release tooling is pinned so a new upstream release cannot change what we sign.
      - run: cargo install cargo-auditable@0.7.7 cargo-cyclonedx@0.5.9 --locked
      - run: cargo auditable build --locked --release --bin straton-engine
      - run: cargo cyclonedx --all --format json
      - name: Stage binary and per-crate SBOMs
        shell: bash
        run: |
          mkdir -p release
          cp target/release/straton-engine release/straton-engine-linux-x86_64
          python3 - <<'PY'
          import json
          import pathlib
          import shutil
          for name in ('straton-core', 'straton-connectors', 'straton-engine'):
              candidates = []
              for path in pathlib.Path('crates', name).glob('*.json'):
                  if json.loads(path.read_text()).get('bomFormat') == 'CycloneDX':
                      candidates.append(path)
              if len(candidates) != 1:
                  raise SystemExit(f'Expected one CycloneDX SBOM for {name}: {candidates}')
              shutil.copyfile(candidates[0], pathlib.Path('release', name + '.cdx.json'))
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - name: Checksum and keyless-sign every artifact
        working-directory: release
        shell: bash
        run: |
          shopt -s nullglob
          files=(straton-engine-linux-x86_64 *.cdx.json *.deb *.AppImage *.dmg *-setup.exe)
          sha256sum "${files[@]}" > SHA256SUMS
          for artifact in "${files[@]}" SHA256SUMS; do
            cosign sign-blob --yes --bundle "$artifact.sigstore.json" "$artifact"
          done
      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes
