[package]
name = "straton-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"

# Separate workspace: the desktop builds independently of the engine.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-websocket = "2"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
base64 = "0.22"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["net", "time", "io-util", "macros", "rt"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "=2.7.1"
