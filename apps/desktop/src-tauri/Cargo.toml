[package]
name = "straton-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"

# Separate workspace: the desktop builds independently of the engine.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-websocket = "2"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
