# Copy to straton.toml. Cron includes a seconds field and uses UTC.
data_dir = "data"
bind = "127.0.0.1:8787"
max_concurrent_runs = 4
max_attempts = 3
# Required together for non-loopback binds:
# tls_cert = "cert.pem"
# tls_key = "key.pem"

[backup]
cron = "0 0 2 * * *"
dir = "data/backups"
keep = 7

[sql]
enabled = true
bind = "127.0.0.1:5433"
query_timeout_secs = 60
max_rows = 100_000
memory_limit_mb = 1024
# All settings support STRATON_SQL_* environment overrides.

[encryption]
enabled = true
# STRATON_ENCRYPTION_ENABLED=false makes new runs plaintext; encrypted reads still need their key.

[network]
# Connectors may reach loopback/private addresses (typical for self-hosted sources).
# Link-local and cloud instance-metadata addresses are always refused.
# Set false to also refuse private ranges; STRATON_NETWORK_ALLOW_PRIVATE overrides.
allow_private = true

[secrets]
# Store connector secrets and the KEK as owner-only files instead of the OS keychain.
# REQUIRED on Linux servers: the kernel keyring used by default is lost on reboot.
# Keep it outside data_dir and back it up separately (it unlocks encrypted snapshots).
# dir = "/var/lib/straton/secrets"   # or STRATON_SECRETS_DIR

[lineage]
# Send OpenLineage run events (START/COMPLETE/FAIL/ABORT) for syncs and model runs, for
# Marquez, DataHub, OpenMetadata or Unity Catalog. Off when unset. HTTPS, or HTTP on loopback.
# openlineage_url = "http://127.0.0.1:5000/api/v1/lineage"   # or STRATON_LINEAGE_OPENLINEAGE_URL
namespace = "straton"                                        # or STRATON_LINEAGE_NAMESPACE
# A bearer API key, if the collector needs one, comes only from STRATON_OPENLINEAGE_API_KEY.
