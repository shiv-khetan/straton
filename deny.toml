# Offline license inventory: all 487 registry packages in Cargo.lock were inspected.
# OR alternatives need no exception when an allowed license satisfies the expression.
[advisories]
version = 2
# Vulnerabilities are denied by cargo-deny. Each ignore below is temporary and justified.
ignore = [
  # zstd 0.13 / zstd-safe 7 arrive only through arrow-ipc's default features. Arrow 59 pins
  # zstd 0.13 and DataFusion 55.2 (latest) requires Arrow 59, so no patched path exists yet.
  # Straton never reads or writes zstd-compressed Arrow IPC. Remove when DataFusion moves to
  # Arrow 60 (zstd 0.14.3+ / zstd-safe 8.2+).
  { id = "RUSTSEC-2026-0391", reason = "zstd via arrow-ipc defaults; IPC zstd unused; no compatible fix yet" },
  { id = "RUSTSEC-2026-0398", reason = "zstd-safe via arrow-ipc defaults; seekable decompress unused; no compatible fix yet" },
  { id = "RUSTSEC-2026-0403", reason = "zstd-safe via arrow-ipc defaults; legacy frame streaming unused; no compatible fix yet" },
]
yanked = "deny"

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
  "Unicode-3.0", "MPL-2.0", "CDLA-Permissive-2.0",
]
# tiny-keccak has only CC0-1.0; const-random-macro uses it for compile-time hashing.
[[licenses.exceptions]]
name = "tiny-keccak"
version = "=2.0.2"
allow = ["CC0-1.0"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
