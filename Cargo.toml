[workspace]
members = ["crates/straton-core", "crates/straton-engine", "crates/straton-connectors"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
arrow = { version = "59", default-features = false }
thiserror = "2"
