[package]
name = "straton-connectors"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
straton-core = { path = "../straton-core" }
arrow = { version = "59", default-features = false, features = ["csv"] }
futures.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "sqlite", "chrono", "json", "macros"] }
parquet = { version = "59", default-features = false, features = ["arrow", "snap", "encryption"] }
tokio = { version = "1", features = ["fs", "rt", "time", "sync"] }
async-trait = "0.1.92"
chrono.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
rand = "0.9"
serde.workspace = true

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
